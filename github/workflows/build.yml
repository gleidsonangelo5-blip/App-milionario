name: Build App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install
      run: pip install buildozer cython
    - name: Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > milionario.keystore
        sed -i 's/TROCAR_SENHA_AQUI/${{ secrets.KEYSTORE_PASSWORD }}/g' buildozer.spec
    - name: Build
      run: buildozer android release
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: aab
        path: bin/*.aab
