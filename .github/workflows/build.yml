name: Build AAB para Play Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
    - name: Preparar Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > milionario.keystore
        sed -i 's/TROCAR_SENHA_AQUI/${{ secrets.KEYSTORE_PASSWORD }}/g' buildozer.spec
    - name: Build with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer android release
        buildozer_version: stable
    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: aplicativo-play-store
        path: bin/*.aab
