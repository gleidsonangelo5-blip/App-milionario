 name: Build App
on: push
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
      - name: Baixar ANT
        run: mkdir -p ~/.buildozer/android/platform && cd ~/.buildozer/android/platform && curl -L -o ant.tar.gz https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.4-bin.tar.gz && tar -xzf ant.tar.gz
      - name: Install Buildozer
        run: python -m pip install --upgrade pip && pip install buildozer cython virtualenv
      - name: Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d > milionario.keystore && sed -i 's/TROCAR_SENHA_AQUI/${{ secrets.KEYSTORE_PASSWORD }}/g' buildozer.spec
      - name: Accept Licenses
        run: yes | buildozer android update || true
      - name: Build
        run: buildozer android release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: bin/*.aab 
